<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background disc gradient -->
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#3a3f58"/>
      <stop offset="45%" stop-color="#202334"/>
      <stop offset="85%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </radialGradient>

    <!-- Iridescent DVD sheen -->
    <linearGradient id="sheen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0070f3" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#00dfd8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="sheen2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd600" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Outer rim metallic stroke -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e9bb0"/>
      <stop offset="50%" stop-color="#2d3345"/>
      <stop offset="100%" stop-color="#707c93"/>
    </linearGradient>

    <!-- Play button gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff8f00" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer disc body with shadow -->
  <circle cx="128" cy="128" r="114" fill="url(#discGrad)" stroke="url(#rimGrad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- DVD track grooves -->
  <circle cx="128" cy="128" r="102" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="128" cy="128" r="82" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Iridescent spectral reflection wedges -->
  <path d="M 128 128 L 38 48 A 114 114 0 0 1 128 14 Z" fill="url(#sheen1)" opacity="0.75"/>
  <path d="M 128 128 L 218 208 A 114 114 0 0 1 128 242 Z" fill="url(#sheen1)" opacity="0.75"/>
  <path d="M 128 128 L 208 38 A 114 114 0 0 1 242 128 Z" fill="url(#sheen2)" opacity="0.7"/>
  <path d="M 128 128 L 48 218 A 114 114 0 0 1 14 128 Z" fill="url(#sheen2)" opacity="0.7"/>

  <!-- Inner clear mirror clamping ring -->
  <circle cx="128" cy="128" r="48" fill="#1b1f2e" stroke="#4a5568" stroke-width="2" fill-opacity="0.85"/>
  <circle cx="128" cy="128" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Center spindle hole -->
  <circle cx="128" cy="128" r="22" fill="#0c0e17" stroke="#333b4f" stroke-width="3"/>

  <!-- "TINY" text badge or compact indicator accent -->
  <path d="M 112 108 L 152 128 L 112 148 Z" fill="url(#playGrad)" filter="url(#glow)"/>

  <!-- Highlights on rim -->
  <path d="M 24 128 A 104 104 0 0 1 128 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25"/>
</svg>
